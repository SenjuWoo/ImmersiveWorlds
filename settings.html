<div id="iw-settings-block" class="imx-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b><i class="fa-solid fa-city"></i> Immersive Worlds</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <small class="imx-note">A persistent living world per chat: clock, weather, places, people with routines, items and threads. Start one from the wand menu or <code>/iw start</code>; chats without a world cost nothing.</small>
            <div class="flex-container flexGap5">
                <div id="iw-open-panel" class="menu_button menu_button_icon"><i class="fa-solid fa-compass"></i><span>Open Living World</span></div>
            </div>

            <label class="checkbox_label"><input type="checkbox" data-iw-setting="enabled"><span>Enabled</span></label>
            <label class="checkbox_label"><input type="checkbox" data-iw-setting="autoDirector"><span>Update the world after each reply (background director)</span></label>
            <label class="checkbox_label"><input type="checkbox" data-iw-setting="strictUserAgency"><span>Never write the user's words, thoughts or choices</span></label>
            <label class="checkbox_label"><input type="checkbox" data-iw-setting="showStatus"><span>Show time and place above the chat input</span></label>
            <label class="checkbox_label"><input type="checkbox" data-iw-setting="ambientEffects"><span>Tint the screen by time of day</span></label>

            <h4 class="imx-h">HUD</h4>
            <label class="checkbox_label"><input type="checkbox" data-iw-setting="hud"><span>Show the HUD in the space beside the chat (scene, people, items, map)</span></label>
            <label class="checkbox_label"><input type="checkbox" data-iw-setting="spriteFaces"><span>Use expression sprites as faces when a character has them</span></label>
            <div class="imx-field">
                <label for="iw-reveal">What the HUD reveals</label>
                <select id="iw-reveal" class="text_pole" data-iw-setting="hudReveal">
                    <option value="senses">Only what I sense</option><option value="nearby">Everything nearby</option><option value="all">Everything (secrets too)</option>
                </select>
            </div>

            <h4 class="imx-h">Director</h4>
            <div class="imx-field" id="iw-profile-row">
                <label for="iw-profile">Connection profile <small>(empty = current connection; a fast cheap model is ideal)</small></label>
                <select id="iw-profile" class="text_pole"></select>
            </div>
            <label class="checkbox_label"><input type="checkbox" data-iw-setting="noReasoning"><span>Skip model reasoning for world updates (faster, cheaper)</span></label>
            <label class="checkbox_label"><input type="checkbox" data-iw-setting="suspendDirectorOnApiError"><span>Pause the director if the API rejects its request</span></label>
            <div class="imx-grid-2">
                <div class="imx-field">
                    <label for="iw-every">Run every</label>
                    <select id="iw-every" class="text_pole" data-iw-setting="directorEvery" data-type="number">
                        <option value="1">reply</option><option value="2">2 replies</option><option value="3">3 replies</option><option value="5">5 replies</option>
                    </select>
                </div>
                <div class="imx-field">
                    <label for="iw-detail">Growth</label>
                    <select id="iw-detail" class="text_pole" data-iw-setting="simulationDetail">
                        <option value="balanced">Restrained</option><option value="high">Lively</option><option value="maximum">Bustling</option>
                    </select>
                </div>
                <div class="imx-field">
                    <label for="iw-director-tokens">Update tokens</label>
                    <input id="iw-director-tokens" class="text_pole" type="number" min="400" max="8192" step="100" data-iw-setting="directorTokens" data-type="number">
                </div>
                <div class="imx-field">
                    <label for="iw-bootstrap-tokens">World-build tokens</label>
                    <input id="iw-bootstrap-tokens" class="text_pole" type="number" min="1500" max="8192" step="250" data-iw-setting="bootstrapTokens" data-type="number">
                </div>
                <div class="imx-field">
                    <label for="iw-temp">Temperature</label>
                    <input id="iw-temp" class="text_pole" type="number" min="0" max="1.5" step="0.05" data-iw-setting="temperature" data-type="number">
                </div>
                <div class="imx-field">
                    <label for="iw-depth">Prompt depth</label>
                    <input id="iw-depth" class="text_pole" type="number" min="0" max="20" data-iw-setting="injectDepth" data-type="number">
                </div>
            </div>
            <label class="checkbox_label"><input type="checkbox" data-iw-setting="allowNewCharacters"><span>New people may appear</span></label>
            <label class="checkbox_label"><input type="checkbox" data-iw-setting="allowNewItems"><span>New items may appear</span></label>
            <label class="checkbox_label"><input type="checkbox" data-iw-setting="allowNewLocations"><span>New places may appear</span></label>
            <label class="checkbox_label"><input type="checkbox" data-iw-setting="allowOffscreenEvents"><span>Off-screen events</span></label>
            <label class="checkbox_label"><input type="checkbox" data-iw-setting="debug"><span>Debug log (browser console)</span></label>
        </div>
    </div>
</div>
